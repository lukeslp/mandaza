# Mandaza uses independent tablet and TV applications on Amazon devices.
project: mandaza
version: "1.3.3"
platforms: [android, fire-tablet, fire-tv, android-tv]
notes: |
  Fire tablet uses app.mandaza.android and the amazon flavor at version code
  10308. Fire TV uses the independent app.mandaza.tv package and 203xx version
  band. Evidence, listings, and signing identity are tracked separately.
