<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root{
    --accent: __ACCENT__;          /* e.g. 120,220,255 */
    --accent2: __ACCENT2__;        /* secondary glow, e.g. 150,120,255 */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1320px;height:2868px;overflow:hidden}
  body{
    position:relative;
    background:#040406;
    font-family:-apple-system,system-ui,"SF Pro Display",sans-serif;
    -webkit-font-smoothing:antialiased;
    color:#fff;
  }
  /* Palette bloom rising behind the device */
  .bloom{
    position:absolute; left:50%; top:56%;
    width:1700px; height:1700px; transform:translate(-50%,-50%);
    background:
      radial-gradient(closest-side, rgba(var(--accent),0.42), rgba(var(--accent),0.10) 42%, transparent 70%);
    filter:blur(30px);
  }
  .bloom2{
    position:absolute; left:24%; top:38%;
    width:1100px; height:1100px; transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, rgba(var(--accent2),0.26), transparent 68%);
    filter:blur(40px);
  }
  /* faint vignette to seat the phone */
  .vignette{
    position:absolute; inset:0;
    background:radial-gradient(130% 90% at 50% 42%, transparent 55%, rgba(0,0,0,0.55) 100%);
  }
  /* grain */
  .grain{
    position:absolute; inset:0; opacity:0.05; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .stage{position:absolute; inset:0; display:flex; flex-direction:column}

  /* Header block */
  .head{padding:190px 130px 0}
  .eyebrow{
    font-size:34px; font-weight:600; letter-spacing:0.42em; text-transform:uppercase;
    color:rgb(var(--accent)); opacity:0.9; margin-bottom:38px;
    text-shadow:0 0 26px rgba(var(--accent),0.55);
  }
  .headline{
    font-size:118px; line-height:1.02; font-weight:600; letter-spacing:-0.028em;
    max-width:1040px; color:#fdfdff;
  }
  .subline{
    margin-top:40px; font-size:44px; line-height:1.28; font-weight:400;
    letter-spacing:-0.01em; color:rgba(255,255,255,0.52); max-width:900px;
  }
  .rule{
    margin-top:60px; width:132px; height:5px; border-radius:3px;
    background:linear-gradient(90deg, rgb(var(--accent)), rgba(var(--accent),0));
    box-shadow:0 0 22px rgba(var(--accent),0.6);
  }

  /* Device */
  .deviceWrap{flex:1; position:relative}
  .device{
    position:absolute; left:50%; top:150px; transform:translateX(-50%);
    width:1104px; height:2392px;               /* ~iPhone aspect; bleeds off bottom */
    border-radius:150px;
    padding:22px;                               /* bezel thickness */
    background:linear-gradient(160deg,#17171c,#0a0a0d 60%);
    box-shadow:
      0 0 0 2px rgba(255,255,255,0.06) inset,
      0 40px 120px rgba(0,0,0,0.6),
      0 0 130px rgba(var(--accent),0.32);       /* neon rim glow */
  }
  .screen{
    width:100%; height:100%; border-radius:130px; overflow:hidden;
    position:relative; background:#000;
  }
  .screen img{width:100%; height:100%; object-fit:cover; display:block}
  .island{
    position:absolute; top:34px; left:50%; transform:translateX(-50%);
    width:250px; height:74px; border-radius:40px; background:#000;
    box-shadow:0 0 0 1px rgba(255,255,255,0.04);
  }
</style>
</head>
<body>
  <div class="bloom"></div>
  <div class="bloom2"></div>
  <div class="vignette"></div>
  <div class="stage">
    <div class="head">
      <div class="eyebrow">Mandaza</div>
      <div class="headline">__HEADLINE__</div>
      <div class="subline">__SUBLINE__</div>
      <div class="rule"></div>
    </div>
    <div class="deviceWrap">
      <div class="device">
        <div class="screen">
          <img src="__DEVICE__" alt="">
          <div class="island"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="grain"></div>
</body>
</html>
