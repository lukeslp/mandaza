name: Mandaza
options:
  bundleIdPrefix: com.lukesteuber.mandaza
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: 596T7J7FB6
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

# MandazaCore holds the shared engine/palette/settings sources. Every target
# compiles these files directly (the MandazaKit Package.swift exists only for
# external SPM consumers and must be excluded from app/extension/test builds).

targets:

  Mandaza:
    type: application
    platform: iOS
    sources:
      - path: Mandaza
      - path: MandazaCore
        excludes:
          - Package.swift
          - ".swiftpm"
    info:
      path: Mandaza/Info.plist
      properties:
        CFBundleDisplayName: Mandaza
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "11"
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchSplashIOS
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: Mandaza saves your generated artwork to Photos so you can use it as a wallpaper.
        CFBundleURLTypes:
          - CFBundleURLName: com.lukesteuber.mandaza
            CFBundleURLSchemes:
              - mandaza
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukesteuber.mandaza
        CODE_SIGN_ENTITLEMENTS: Mandaza/Mandaza.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - target: MandazaWidgets

  MandazaTV:
    type: application
    platform: tvOS
    sources:
      - path: MandazaTV
      - path: MandazaCore
        excludes:
          - Package.swift
          - ".swiftpm"
      - path: Mandaza/MandazaCanvas.swift
    info:
      path: MandazaTV/Info.plist
      properties:
        CFBundleDisplayName: Mandaza
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "11"
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.lukesteuber.mandaza
            CFBundleURLSchemes:
              - mandaza
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukesteuber.mandaza.tv
        CODE_SIGN_ENTITLEMENTS: MandazaTV/MandazaTV.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TVOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "3"
        SUPPORTED_PLATFORMS: "appletvos appletvsimulator"

  MandazaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MandazaWidgets
      - path: MandazaCore
        excludes:
          - Package.swift
          - ".swiftpm"
    info:
      path: MandazaWidgets/Info.plist
      properties:
        CFBundleDisplayName: Mandaza Widgets
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "11"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukesteuber.mandaza.widgets
        CODE_SIGN_ENTITLEMENTS: MandazaWidgets/MandazaWidgets.entitlements
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  MandazaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MandazaTests
      - path: MandazaCore
        excludes:
          - Package.swift
          - ".swiftpm"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukesteuber.mandaza.tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    dependencies:
      - target: Mandaza

schemes:

  Mandaza:
    build:
      targets:
        Mandaza: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MandazaTests

  MandazaTV:
    build:
      targets:
        MandazaTV: all
    run:
      config: Debug
