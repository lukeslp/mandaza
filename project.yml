name: Mandaza
options:
  bundleIdPrefix: com.lukesteuber.mandaza
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: 596T7J7FB6
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # Build number flows from the archive (scripts set CURRENT_PROJECT_VERSION
    # to the git commit count); this default keeps non-archive builds valid.
    CURRENT_PROJECT_VERSION: "44"

# MandazaCore holds the shared engine/palette/settings sources. Every target
# compiles these files directly (the MandazaKit Package.swift exists only for
# external SPM consumers and must be excluded from app/extension/test builds).

targets:

  Mandaza:
    type: application
    platform: iOS
    sources:
      - path: Mandaza
      - path: MandazaCore
        excludes:
          - Package.swift
          - ".swiftpm"
          - ".swiftpm/**"
          - ".build"
          - ".build/**"
          - Tests
          - "Tests/**"
    info:
      path: Mandaza/Info.plist
      properties:
        CFBundleDisplayName: Mandaza
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.3"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchSplashIOS
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: Mandaza saves your generated artwork to Photos so you can use it as a wallpaper.
        NSMicrophoneUsageDescription: Mandaza listens to ambient sound so the mandala can move with your music. Audio is never recorded or stored.
        CFBundleURLTypes:
          - CFBundleURLName: com.lukesteuber.mandaza
            CFBundleURLSchemes:
              - mandaza
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukesteuber.mandaza
        CODE_SIGN_ENTITLEMENTS: Mandaza/Mandaza.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - target: MandazaWidgets
      # Standalone watchOS companion, embedded in the iOS build only (ships
      # under the same App Store record). Not embedded in tvOS.
      - target: MandazaWatch
        embed: true
        destinationFilters: [iOS]

  MandazaTV:
    type: application
    platform: tvOS
    sources:
      - path: MandazaTV
      - path: MandazaCore
        excludes:
          - Package.swift
          - ".swiftpm"
          - ".swiftpm/**"
          - ".build"
          - ".build/**"
          - Tests
          - "Tests/**"
    info:
      path: MandazaTV/Info.plist
      properties:
        CFBundleDisplayName: Mandaza
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.3"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.lukesteuber.mandaza
            CFBundleURLSchemes:
              - mandaza
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukesteuber.mandaza.tv
        CODE_SIGN_ENTITLEMENTS: MandazaTV/MandazaTV.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TVOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "3"
        SUPPORTED_PLATFORMS: "appletvos appletvsimulator"

  MandazaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MandazaWidgets
      - path: MandazaCore
        excludes:
          - Package.swift
          - ".swiftpm"
          - ".swiftpm/**"
          - ".build"
          - ".build/**"
          - Tests
          - "Tests/**"
    info:
      path: MandazaWidgets/Info.plist
      properties:
        CFBundleDisplayName: Mandaza Widgets
        CFBundleShortVersionString: "1.3"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukesteuber.mandaza.widgets
        CODE_SIGN_ENTITLEMENTS: MandazaWidgets/MandazaWidgets.entitlements
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  MandazaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MandazaTests
      - path: MandazaCore
        excludes:
          - Package.swift
          - ".swiftpm"
          - ".swiftpm/**"
          - ".build"
          - ".build/**"
          - Tests
          - "Tests/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukesteuber.mandaza.tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    dependencies:
      - target: Mandaza

  # Standalone watchOS app: a live animated-mandala face. Thin shell over the
  # shared MandazaCore engine (compiled directly, like the other targets).
  MandazaWatch:
    type: application
    platform: watchOS
    sources:
      - path: MandazaWatch
      - path: MandazaCore
        excludes:
          - Package.swift
          - ".swiftpm"
          - ".swiftpm/**"
          - ".build"
          - ".build/**"
          - Tests
          - "Tests/**"
    info:
      path: MandazaWatch/Info.plist
      properties:
        CFBundleDisplayName: Mandaza
        CFBundleShortVersionString: "1.3"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.lukesteuber.mandaza
        NSMicrophoneUsageDescription: Mandaza listens to ambient sound so the mandala can move with your music. Audio is never recorded or stored.
        # actool injects this inconsistently for watch targets; declare it
        # explicitly so the archive validator always finds the icon name.
        CFBundleIconName: AppIcon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukesteuber.mandaza.watchkitapp
        CODE_SIGN_ENTITLEMENTS: MandazaWatch/MandazaWatch.entitlements
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        TARGETED_DEVICE_FAMILY: "4"
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:

  Mandaza:
    build:
      targets:
        Mandaza: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MandazaTests

  MandazaTV:
    build:
      targets:
        MandazaTV: all
    run:
      config: Debug

  MandazaWatch:
    build:
      targets:
        MandazaWatch: all
    run:
      config: Debug
